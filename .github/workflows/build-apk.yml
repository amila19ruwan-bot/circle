name: Build Circle APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://circle-indol-tau.vercel.app
  APP_ID: com.circle.test
  APP_NAME: Circle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          mkdir www
          echo '<!doctype html><html><body>Loading...</body></html>' > www/index.html
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          rm -f capacitor.config.ts capacitor.config.json
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Add Firebase config (push notifications)
        run: |
          cat > app/android/app/google-services.json <<'GSJSON'
          {
            "project_info": {
              "project_number": "794529768536",
              "project_id": "circle-23ef2",
              "storage_bucket": "circle-23ef2.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:794529768536:android:ceff95fb3c158bbc6a962d",
                  "android_client_info": {
                    "package_name": "com.circle.test"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDwOWQlj8J_5Cms-Lz045Ol7eozhMSIc7g"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          GSJSON
          cd app/android
          grep -q "com.google.gms:google-services" build.gradle || sed -i "0,/dependencies {/s//dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" build.gradle
          grep -q "com.google.gms.google-services" app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> app/build.gradle
          grep -n "google" build.gradle app/build.gradle

      - name: Add camera and mic permissions
        run: |
          cd app/android/app/src/main
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' AndroidManifest.xml
          cat AndroidManifest.xml

      - name: Add pull-to-refresh and back button
        run: |
          cd app/android/app
          sed -i '0,/dependencies {/s//dependencies {\n    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"/' build.gradle
          cat > src/main/java/com/circle/test/MainActivity.java <<'JAVA'
          package com.circle.test;

          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private boolean backPatched = false;
            private volatile boolean atTop = true;

            @Override
            public void onStart() {
              super.onStart();
              final WebView webView = getBridge().getWebView();

              /* the page (native-push.js) tells us whether the scrolled area under the finger is at its top */
              webView.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void setTop(boolean t) { atTop = t; }
              }, "CircleNative");

              if (!backPatched) {
                backPatched = true;
                getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                  @Override
                  public void handleOnBackPressed() {
                    if (webView.canGoBack()) {
                      webView.goBack();
                    } else {
                      setEnabled(false);
                      getOnBackPressedDispatcher().onBackPressed();
                    }
                  }
                });
              }

              if (webView.getParent() instanceof SwipeRefreshLayout) return;
              ViewGroup parent = (ViewGroup) webView.getParent();
              int index = parent.indexOfChild(webView);
              ViewGroup.LayoutParams lp = webView.getLayoutParams();
              parent.removeView(webView);
              final SwipeRefreshLayout swipe = new SwipeRefreshLayout(this);
              swipe.addView(webView, new ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              parent.addView(swipe, index, lp);
              /* true = the content can still scroll up, so do NOT start a refresh */
              swipe.setOnChildScrollUpCallback((p, c) -> !atTop || webView.getScrollY() > 0);
              swipe.setOnRefreshListener(() -> {
                webView.reload();
                swipe.postDelayed(() -> swipe.setRefreshing(false), 1000);
              });
            }
          }
          JAVA

      - name: Set app icon from repo
        run: |
          ls -la "$GITHUB_WORKSPACE"/icon-*.png
          cd app/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$GITHUB_WORKSPACE/icon-512.png" $d/ic_launcher.png
            cp "$GITHUB_WORKSPACE/icon-512.png" $d/ic_launcher_round.png
            cp "$GITHUB_WORKSPACE/icon-512.png" $d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Circle.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Circle APK ${{ github.run_number }}
          files: Circle.apk
