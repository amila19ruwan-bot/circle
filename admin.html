<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a3fd8">
<title>Circle Admin</title>
<style>
  :root { --blue: #0a3fd8; --blue2: #2f6bff; --ink: #1b1f7a; --muted: #5a64b8; --red: #ef4444; --bg: #eef3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: linear-gradient(180deg, #eef3ff 0%, #dbe6ff 55%, #cbbdfb 100%); min-height: 100vh; background-attachment: fixed; }
  .hidden { display: none !important; }
  header { background: linear-gradient(135deg, var(--blue2), var(--blue)); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 22px; margin: 0; }
  header button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; }
  main { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
  .card { background: rgba(255,255,255,.95); border-radius: 24px; padding: 16px; box-shadow: 0 8px 22px rgba(20,40,160,.12); margin: 12px 0; }
  .login { max-width: 380px; margin: 60px auto; }
  .login h2 { margin: 0 0 14px; font-size: 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid #c7d2fe; background: #fff; color: var(--ink); }
  input:focus, textarea:focus { outline: 2px solid var(--blue2); border-color: transparent; }
  .btn { width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 13px; font: inherit; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--blue2), var(--blue)); box-shadow: 0 6px 14px rgba(10,63,216,.35); cursor: pointer; }
  .btn.sm { width: auto; margin: 0; padding: 8px 14px; font-size: 14px; }
  .btn.del { background: linear-gradient(135deg, #f87171, var(--red)); box-shadow: 0 6px 14px rgba(239,68,68,.35); }
  .btn.ghost { background: #fff; color: var(--blue); border: 2px solid var(--blue2); box-shadow: none; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { background: rgba(255,255,255,.95); border-radius: 22px; padding: 14px; box-shadow: 0 8px 22px rgba(20,40,160,.12); }
  .stat b { display: block; font-size: 26px; color: var(--blue); }
  .stat span { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0 4px; overflow-x: auto; }
  .tab { flex: 1; border: 0; border-radius: 999px; padding: 10px 14px; background: #fff; color: var(--blue); font-weight: 800; box-shadow: 0 4px 12px rgba(20,40,160,.1); white-space: nowrap; }
  .tab.on { background: linear-gradient(135deg, var(--blue2), var(--blue)); color: #fff; }
  .row { display: flex; gap: 12px; align-items: center; }
  .av { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #6366f1); color: #fff; display: grid; place-items: center; font-weight: 800; overflow: hidden; flex: 0 0 auto; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; word-break: break-word; }
  .body { margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  .thumb { width: 100%; border-radius: 16px; margin-top: 8px; max-height: 360px; object-fit: cover; background: #e5e7eb; }
  video.thumb { background: #000; }
  .search { margin-bottom: 8px; }
  .msg { min-height: 20px; color: #B42318; font-size: 14px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; }
  .home { display: grid; gap: 16px; margin-top: 30px; }
  .big { border: 0; border-radius: 999px; padding: 22px; font: inherit; font-size: 20px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--blue2), var(--blue)); box-shadow: 0 10px 22px rgba(10,63,216,.35); cursor: pointer; }
  .big.ghost { background: #fff; color: var(--blue); border: 2px solid var(--blue2); box-shadow: none; }
  .user-card { cursor: pointer; }
  .chev { font-size: 30px; color: var(--blue2); padding-right: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="card login">
    <h2>Circle Admin</h2>
    <form id="loginForm">
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Log in</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</div>

<!-- NOT ADMIN -->
<div id="denied" class="hidden">
  <div class="card login">
    <h2>Not allowed</h2>
    <p class="meta">This account is not an admin. Ask the owner to add it to the admins table.</p>
    <button class="btn ghost" onclick="logout()">Log out</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
  <header>
    <h1>Circle Admin</h1>
    <button onclick="logout()">Log out</button>
  </header>
  <main>
    <div id="tabBody"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://swmokmlkpkojbjevxunj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZPXOX4-iPM2xRCwt--xx1g_LB0kjXZG";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = t => t ? new Date(t).toLocaleString() : "";
let tab = "users";
let userSearch = "";
let loggedIn = false;

function toast(t){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function showOnly(id){
  ["login", "denied", "panel"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}

async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showOnly("login");
  const { data, error } = await sb.rpc("is_admin");
  if (error || data !== true) return showOnly("denied");
  showOnly("panel");
  loggedIn = true;
  try { history.replaceState({ s: "home" }, ""); } catch (e) {}
  route({ s: "home" });
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = "Checking…";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { $("loginMsg").textContent = error.message; return; }
  $("loginMsg").textContent = "";
  start();
});

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ---------- stats ---------- */
async function countOf(table){
  const { count, error } = await sb.from(table).select("id", { count: "exact", head: true });
  if (error) throw error;
  return count || 0;
}
async function loadStats(){
  const box = $("stats");
  box.innerHTML = `<div class="stat"><span>Loading…</span></div>`;
  try {
    const [users, posts, reels, comments, friends] = await Promise.all([
      countOf("profiles"), countOf("posts"), countOf("reels"), countOf("comments"), countOf("friendships")
    ]);
    box.innerHTML = [
      ["Users", users], ["Posts", posts], ["Reels", reels], ["Comments", comments], ["Friend links", friends]
    ].map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  } catch (e) {
    box.innerHTML = `<div class="stat"><span>Stats failed: ${esc(e.message)}</span></div>`;
  }
}

/* ---------- tabs ---------- */
function setTab(t){ go({ s: t === "users" ? "users" : "content" }); }
function loadTab(){
  if (tab === "users") return loadUsers();
  if (tab === "content") return loadContent();
  return showHome();
}
function showHome(){ go({ s: "home" }); }
function showHomeView(){
  tab = "home"; userCtx = null;
  setBody(`
    <div class="home">
      <button class="big" onclick="showHome2('users')">👤 Profiles</button>
      <button class="big ghost" onclick="showHome2('content')">🎬 Posts &amp; Videos</button>
    </div>`);
}
function showHome2(t){ setTab(t); }
function setBody(html){ $("tabBody").innerHTML = html; }
function avatarHtml(name, url){
  return `<div class="av">${url ? `<img src="${esc(url)}" alt="">` : esc((name || "?").trim().charAt(0).toUpperCase())}</div>`;
}

/* ---------- users ---------- */
function usersHtml(list){
  if (!list.length) return `<div class="empty">No users found.</div>`;
  return list.map(p => `
    <div class="card user-card" onclick="openUser('${esc(p.id)}')">
      <div class="row">
        ${avatarHtml(p.name, p.avatar_url)}
        <div class="grow">
          <div class="name">${esc(p.name || "(no name)")}</div>
          <div class="meta">Last seen: ${p.last_seen ? esc(when(p.last_seen)) : "never"}</div>
          <div class="meta">ID: ${esc(p.id)}</div>
        </div>
        <span class="chev">›</span>
      </div>
      ${p.bio ? `<div class="body">${esc(p.bio)}</div>` : ""}
    </div>`).join("");
}
async function loadUsers(){
  setBody(`
    <button class="btn ghost" onclick="showHome()">‹ Home</button>
    <div class="card search"><input id="q" placeholder="Search by name" value="${esc(userSearch)}"></div>
    <div id="list"><div class="empty">Loading…</div></div>`);
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") { userSearch = $("q").value.trim(); loadUsers(); } });
  let q = sb.from("profiles").select("id,name,bio,avatar_url,last_seen").order("name").limit(100);
  if (userSearch) q = q.ilike("name", "%" + userSearch + "%");
  const { data, error } = await q;
  $("list").innerHTML = error ? `<div class="msg">${esc(error.message)}</div>` : usersHtml(data || []);
}
async function deleteUserPosts(id){
  if (!confirm("Delete ALL posts by this user? This cannot be undone.")) return;
  const { data, error } = await sb.from("posts").delete().eq("user_id", id).select("id");
  if (error) return toast("Error: " + error.message);
  toast(`Deleted ${data ? data.length : 0} post(s)`);
  refreshList(); 
}

/* ---------- posts & reels (all) ---------- */
async function loadContent(){
  tab = "content";
  setBody(`<button class="btn ghost" onclick="showHome()">‹ Home</button><div id="list"><div class="empty">Loading…</div></div>`);
  const [pr, rr] = await Promise.all([
    sb.from("posts").select("id,body,image_url,created_at,profiles!user_id(name,avatar_url)").order("created_at", { ascending: false }).limit(50),
    sb.from("reels").select("id,caption,video_url,created_at,profiles!user_id(name,avatar_url)").order("created_at", { ascending: false }).limit(30)
  ]);
  if (tab !== "content" || !$("list")) return;
  if (pr.error || rr.error) { $("list").innerHTML = `<div class="msg">${esc((pr.error || rr.error).message)}</div>`; return; }
  const items = [
    ...(pr.data || []).map(p => ({ ...p, kind: "post" })),
    ...(rr.data || []).map(r => ({ ...r, kind: "reel" }))
  ].sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
  if (!items.length) { $("list").innerHTML = `<div class="empty">No posts or reels.</div>`; return; }
  $("list").innerHTML = items.map(it => {
    const pr2 = it.profiles || {};
    const media = it.kind === "post"
      ? (it.image_url ? `<img class="thumb" src="${esc(it.image_url)}" alt="">` : "")
      : (it.video_url ? `<video class="thumb" src="${esc(it.video_url)}" controls preload="metadata" playsinline></video>` : "");
    const text = it.kind === "post" ? it.body : it.caption;
    const del = it.kind === "post" ? `deletePost('${esc(it.id)}')` : `deleteReel('${esc(it.id)}')`;
    return `
    <div class="card">
      <div class="row">${avatarHtml(pr2.name, pr2.avatar_url)}
        <div class="grow"><div class="name">${esc(pr2.name || "?")}</div><div class="meta">${it.kind === "post" ? "Post" : "Reel"} · ${esc(when(it.created_at))}</div></div>
      </div>
      ${text ? `<div class="body">${esc(text)}</div>` : ""}
      ${media}
      <div class="row" style="margin-top:10px"><button class="btn sm del" onclick="${del}">Delete ${it.kind === "post" ? "post" : "reel"}</button></div>
    </div>`;
  }).join("");
}

/* ---------- posts ---------- */
async function loadPosts(){
  setBody(`<div id="list"><div class="empty">Loading…</div></div>`);
  const { data, error } = await sb.from("posts").select("id,body,image_url,created_at,user_id,profiles!user_id(name,avatar_url)").order("created_at", { ascending: false }).limit(50);
  if (error) { $("list").innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { $("list").innerHTML = `<div class="empty">No posts.</div>`; return; }
  $("list").innerHTML = data.map(p => {
    const pr = p.profiles || {};
    return `
    <div class="card">
      <div class="row">
        ${avatarHtml(pr.name, pr.avatar_url)}
        <div class="grow"><div class="name">${esc(pr.name || "?")}</div><div class="meta">${esc(when(p.created_at))}</div></div>
      </div>
      ${p.body ? `<div class="body">${esc(p.body)}</div>` : ""}
      ${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="">` : ""}
      <div class="row" style="margin-top:10px"><button class="btn sm del" onclick="deletePost('${esc(p.id)}')">Delete post</button></div>
    </div>`;
  }).join("");
}
async function deletePost(id){
  if (!confirm("Delete this post?")) return;
  const { data, error } = await sb.from("posts").delete().eq("id", id).select("id");
  if (error) return toast("Error: " + error.message);
  if (!data || !data.length) return toast("Not deleted (no permission)");
  toast("Post deleted");
  refreshList(); 
}

/* ---------- reels ---------- */
async function loadReels(){
  setBody(`<div id="list"><div class="empty">Loading…</div></div>`);
  const { data, error } = await sb.from("reels").select("id,caption,video_url,created_at,user_id,profiles!user_id(name,avatar_url)").order("created_at", { ascending: false }).limit(30);
  if (error) { $("list").innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
  if (!data || !data.length) { $("list").innerHTML = `<div class="empty">No reels.</div>`; return; }
  $("list").innerHTML = data.map(r => {
    const pr = r.profiles || {};
    return `
    <div class="card">
      <div class="row">
        ${avatarHtml(pr.name, pr.avatar_url)}
        <div class="grow"><div class="name">${esc(pr.name || "?")}</div><div class="meta">${esc(when(r.created_at))}</div></div>
      </div>
      ${r.caption ? `<div class="body">${esc(r.caption)}</div>` : ""}
      ${r.video_url ? `<video class="thumb" src="${esc(r.video_url)}" controls preload="metadata" playsinline></video>` : ""}
      <div class="row" style="margin-top:10px"><button class="btn sm del" onclick="deleteReel('${esc(r.id)}')">Delete reel</button></div>
    </div>`;
  }).join("");
}
async function deleteReel(id){
  if (!confirm("Delete this reel?")) return;
  const { data, error } = await sb.from("reels").delete().eq("id", id).select("id");
  if (error) return toast("Error: " + error.message);
  if (!data || !data.length) return toast("Not deleted (no permission)");
  toast("Reel deleted");
  refreshList(); 
}

/* ---------- one user: two buttons (posts & reels, delete all) ---------- */
let userCtx = null;
function refreshList(){
  if (userCtx) return userCtx.open ? loadUserContent() : loadUserView();
  return loadTab();
}
function openUser(id){ go({ s: "user", id }); }
function closeUser(){ go({ s: "users" }); }
async function loadUserView(){
  const id = userCtx.id;
  setBody(`
    <button class="btn ghost" onclick="closeUser()">‹ Back to users</button>
    <div class="card">
      <div class="name" id="uname">Loading…</div>
      <div class="meta">ID: ${esc(id)}</div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="btn sm ghost" onclick="showUserContent()">Posts &amp; reels</button>
        <button class="btn sm del" onclick="deleteUserPosts('${esc(id)}')">Delete all their posts</button>
      </div>
    </div>
    <div id="list"></div>`);
  const { data } = await sb.from("profiles").select("name").eq("id", id).maybeSingle();
  if (userCtx && userCtx.id === id && $("uname")) $("uname").textContent = (data && data.name) || "(no name)";
}
function showUserContent(){
  if (!userCtx) return;
  go({ s: "user", id: userCtx.id, open: true });
}
async function loadUserContent(){
  const id = userCtx.id;
  if ($("list")) $("list").innerHTML = `<div class="empty">Loading…</div>`;
  const [pr, rr] = await Promise.all([
    sb.from("posts").select("id,body,image_url,created_at,profiles!user_id(name,avatar_url)").eq("user_id", id).order("created_at", { ascending: false }).limit(50),
    sb.from("reels").select("id,caption,video_url,created_at,profiles!user_id(name,avatar_url)").eq("user_id", id).order("created_at", { ascending: false }).limit(30)
  ]);
  if (!userCtx || userCtx.id !== id || !$("list")) return;
  if (pr.error || rr.error) { $("list").innerHTML = `<div class="msg">${esc((pr.error || rr.error).message)}</div>`; return; }
  const posts = (pr.data || []).map(p => `
    <div class="card">
      <div class="meta">Post · ${esc(when(p.created_at))}</div>
      ${p.body ? `<div class="body">${esc(p.body)}</div>` : ""}
      ${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="">` : ""}
      <div class="row" style="margin-top:10px"><button class="btn sm del" onclick="deletePost('${esc(p.id)}')">Delete post</button></div>
    </div>`).join("");
  const reels = (rr.data || []).map(r => `
    <div class="card">
      <div class="meta">Reel · ${esc(when(r.created_at))}</div>
      ${r.caption ? `<div class="body">${esc(r.caption)}</div>` : ""}
      ${r.video_url ? `<video class="thumb" src="${esc(r.video_url)}" controls preload="metadata" playsinline></video>` : ""}
      <div class="row" style="margin-top:10px"><button class="btn sm del" onclick="deleteReel('${esc(r.id)}')">Delete reel</button></div>
    </div>`).join("");
  $("list").innerHTML = (posts + reels) || `<div class="empty">No posts or reels from this user.</div>`;
}

/* ---------- back button: keep the admin panel open, go to the previous screen ---------- */
function go(st, push = true){
  if (push){ try { history.pushState(st, ""); } catch (e) {} }
  route(st);
}
function route(st){
  st = st || { s: "home" };
  if (st.s === "users"){ tab = "users"; userCtx = null; return loadUsers(); }
  if (st.s === "content"){ userCtx = null; return loadContent(); }
  if (st.s === "user" && st.id){
    userCtx = { id: st.id, open: !!st.open };
    loadUserView();
    if (st.open) loadUserContent();
    return;
  }
  showHomeView();
}
window.addEventListener("popstate", e => {
  if (!loggedIn) return;
  const st = e.state || { s: "home" };
  if (st.s === "home"){ try { history.pushState({ s: "home" }, ""); } catch (er) {} }
  route(st);
});

/* ================= Admin v2 (overrides earlier functions) ================= */
let myRole = "admin", fStatus = "all", fSort = "new";
const canStatus = () => myRole !== "moderator";
const effStatus = p => (p.status === "suspended" && p.suspended_until && new Date(p.suspended_until) < new Date()) ? "active" : (p.status || "active");
const isOnline = p => p.last_seen && (Date.now() - new Date(p.last_seen)) < 120000;
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast("Error: " + error.message); throw error; } return data; };
function reason(t){ const r = prompt(t + "\nReason (required):"); return r && r.trim() ? r.trim() : null; }
const badge = s => `<span class="meta" style="font-weight:800">${esc(s)}</span>`;

const _start = start;
start = async function(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) { const r = await sb.rpc("admin_role"); if (!r.error && r.data) myRole = r.data; }
  return _start();
};

function showHomeView(){
  tab = "home"; userCtx = null;
  setBody(`<div class="card"><b>Role:</b> ${esc(myRole)}</div><div id="stats" class="stats"></div>
    <div class="home" style="margin-top:14px">
      <button class="big" onclick="go({s:'users'})">👤 Profiles</button>
      <button class="big ghost" onclick="go({s:'content'})">🎬 Posts &amp; Videos</button>
      <button class="big ghost" onclick="go({s:'reports'})">🚩 Reports</button>
      <button class="big ghost" onclick="go({s:'log'})">📜 Admin Activity Log</button></div>`);
  loadStats();
}
loadStats = async function(){
  const box = $("stats"); box.innerHTML = `<div class="stat"><span>Loading…</span></div>`;
  try {
    const d = await rpc("admin_dashboard");
    box.innerHTML = [["Users", d.users], ["Active (7d)", d.active], ["Online now", d.online], ["Blocked/banned", d.blocked], ["Suspended", d.suspended],
      ["Posts", d.posts], ["Reels", d.reels], ["Pending reports", d.pending_reports], ["Resolved reports", d.resolved_reports]]
      .map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  } catch (e) { box.innerHTML = `<div class="stat"><span>Run migration-admin-v2.sql first</span></div>`; }
};

function usersHtml(list){
  if (!list.length) return `<div class="empty">No users found.</div>`;
  return list.map(p => `<div class="card user-card" onclick="openUser('${esc(p.id)}')"><div class="row">${avatarHtml(p.name, p.avatar_url)}
    <div class="grow"><div class="name">${esc(p.name || "(no name)")}${p.is_verified ? " ✔" : ""} <span class="meta">${p.username ? "@" + esc(p.username) : ""}</span></div>
      <div class="meta">${isOnline(p) ? "🟢 Online" : "⚪ Offline"} · ${esc(effStatus(p))}</div>
      <div class="meta">Last seen: ${p.last_seen ? esc(when(p.last_seen)) : "never"}</div>
      <div class="meta">ID: ${esc(p.id)}</div></div><span class="chev">›</span></div></div>`).join("");
}
loadUsers = async function(){
  setBody(`<button class="btn ghost" onclick="showHome()">‹ Home</button>
    <div class="card search"><input id="q" placeholder="Search name or ID (Enter)" value="${esc(userSearch)}">
    <div class="row" style="margin-top:8px"><select id="fs">${["all","active","blocked","suspended","banned","restricted","disabled"].map(s => `<option ${s === fStatus ? "selected" : ""}>${s}</option>`).join("")}</select>
    <select id="so"><option value="new" ${fSort === "new" ? "selected" : ""}>Newest</option><option value="old" ${fSort === "old" ? "selected" : ""}>Oldest</option><option value="seen" ${fSort === "seen" ? "selected" : ""}>Last active</option></select></div></div>
    <div id="list"><div class="empty">Loading…</div></div>`);
  const go2 = () => { userSearch = $("q").value.trim(); fStatus = $("fs").value; fSort = $("so").value; loadUsers(); };
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") go2(); });
  $("fs").onchange = go2; $("so").onchange = go2;
  let q = sb.from("profiles").select("*").limit(100);
  if (userSearch) q = /^[0-9a-f-]{32,36}$/i.test(userSearch) ? q.eq("id", userSearch) : q.or(`name.ilike.%${userSearch.replace(/[,()]/g, "")}%,username.ilike.%${userSearch.replace(/[,()]/g, "")}%`);
  if (fStatus !== "all") q = q.eq("status", fStatus);
  q = fSort === "seen" ? q.order("last_seen", { ascending: false, nullsFirst: false }) : q.order("created_at", { ascending: fSort === "old" });
  const { data, error } = await q;
  if ($("list")) $("list").innerHTML = error ? `<div class="msg">${esc(error.message)} (run migration-admin-v2.sql)</div>` : usersHtml(data || []);
};

loadUserView = async function(){
  const id = userCtx.id;
  setBody(`<button class="btn ghost" onclick="closeUser()">‹ Back to users</button><div class="card" id="ucard">Loading…</div><div id="list"></div>`);
  const [pr, info] = await Promise.all([sb.from("profiles").select("*").eq("id", id).maybeSingle(), sb.rpc("admin_user_info", { p_user: id })]);
  const p = pr.data || {}, i = info.data || {};
  if (!$("ucard") || !userCtx || userCtx.id !== id) return;
  const act = (label, st, d, cls) => canStatus() ? `<button class="btn sm ${cls || "ghost"}" onclick="setStatus('${esc(id)}','${st}',${d || 0})">${label}</button>` : "";
  $("ucard").innerHTML = `<div class="row">${avatarHtml(p.name, p.avatar_url)}<div class="grow"><div class="name">${esc(p.name || "(no name)")}${p.is_verified ? " ✔" : ""}</div>
    <div class="meta">${p.username ? "@" + esc(p.username) : "no username"}</div></div></div>
    <div class="meta" style="margin-top:8px">ID: ${esc(id)}<br>Email: ${esc(i.email || "—")} · Phone: ${esc(i.phone || "—")}<br>
    ${isOnline(p) ? "🟢 Online" : "⚪ Offline"} · Status: <b>${esc(effStatus(p))}</b>${p.suspended_until ? " until " + esc(when(p.suspended_until)) : ""}${p.status_reason ? "<br>Reason: " + esc(p.status_reason) : ""}<br>
    Registered: ${esc(when(i.registered || p.created_at))}<br>Last login: ${esc(when(i.last_login) || "—")}<br>Last seen: ${esc(when(p.last_seen) || "never")}</div>
    ${p.bio ? `<div class="body">${esc(p.bio)}</div>` : ""}
    <div class="stats" style="margin-top:10px">${[["Posts", i.posts], ["Reels", i.reels], ["Comments", i.comments], ["Reports", i.reports]].map(([l, n]) => `<div class="stat"><b>${n == null ? "—" : n}</b><span>${l}</span></div>`).join("")}</div>
    <div class="meta" style="margin-top:6px">Followers/following: not tracked (app uses friendships)</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      ${canStatus() ? `<button class="btn sm" onclick="editUser('${esc(id)}')">Edit profile</button>` : ""}
      ${act("Block", "blocked")}${act("Unblock / Restore", "active")}${act("Suspend 1d", "suspended", 1)}${act("Suspend 7d", "suspended", 7)}${act("Suspend 30d", "suspended", 30)}
      ${act("Restrict", "restricted")}${act("Disable", "disabled")}${act("Ban", "banned", 0, "del")}
      <button class="btn sm ghost" onclick="notifyUser('${esc(id)}','warning')">Send warning</button>
      <button class="btn sm ghost" onclick="notifyUser('${esc(id)}','notice')">Send notice</button>
      <button class="btn sm ghost" onclick="showUserContent()">Posts &amp; reels</button>
      ${canStatus() ? `<button class="btn sm del" onclick="deleteUserPosts('${esc(id)}')">Delete all posts</button>` : ""}
      ${myRole === "super_admin" ? `<button class="btn sm del" onclick="deleteAccount('${esc(id)}')">Delete account</button>` : ""}</div>
    ${(i.notices || []).length ? `<div class="meta" style="margin-top:10px"><b>Recent notices sent</b><br>${i.notices.map(n => esc(when(n.created_at)) + " · " + esc(n.kind) + ": " + esc(n.message)).join("<br>")}</div>` : ""}`;
  window._p = p;
};
async function setStatus(id, st, days){
  const r = reason(`Set status to "${st}"${days ? " for " + days + " day(s)" : ""}`); if (!r) return;
  if (["banned", "disabled", "blocked"].includes(st) && !confirm("Confirm: " + st + "?")) return;
  try { await rpc("admin_set_status", { p_user: id, p_status: st, p_days: days, p_reason: r }); toast("Updated"); loadUserView(); } catch (e) {}
}
async function editUser(id){
  const p = window._p || {};
  const name = prompt("Full name:", p.name || ""); if (name === null) return;
  const un = prompt("Username (blank = none):", p.username || ""); if (un === null) return;
  const bio = prompt("Bio:", p.bio || ""); if (bio === null) return;
  const ver = confirm("Verified badge? OK = verified, Cancel = not verified");
  const r = reason("Edit profile"); if (!r) return;
  try { await rpc("admin_edit_profile", { p_user: id, p_name: name, p_username: un, p_bio: bio, p_verified: ver, p_reason: r }); toast("Saved"); loadUserView(); } catch (e) {}
}
async function notifyUser(id, kind){
  const m = prompt(kind === "warning" ? "Warning message:" : "Notice message:"); if (!m || !m.trim()) return;
  try { await rpc("admin_notify", { p_user: id, p_kind: kind, p_message: m.trim() }); toast("Sent"); loadUserView(); } catch (e) {}
}
async function deleteAccount(id){
  if (!confirm("PERMANENTLY delete this account and all its data?")) return;
  const r = reason("Delete account"); if (!r) return;
  try { await rpc("admin_delete_user", { p_user: id, p_reason: r }); toast("Account deleted"); closeUser(); } catch (e) {}
}
deleteUserPosts = async function(id){
  if (!confirm("Delete ALL posts by this user? This cannot be undone.")) return;
  const r = reason("Delete all posts"); if (!r) return;
  try { const n = await rpc("admin_delete_user_posts", { p_user: id, p_reason: r }); toast(`Deleted ${n} post(s)`); refreshList(); } catch (e) {}
};
async function delContent(table, id){
  if (!confirm("Delete this? This cannot be undone.")) return;
  const r = reason("Delete content"); if (!r) return;
  try { await rpc("admin_delete_content", { p_table: table, p_id: id, p_reason: r }); toast("Deleted"); refreshList(); } catch (e) {}
}
deletePost = id => delContent("posts", id);
deleteReel = id => delContent("reels", id);

async function loadLog(){
  tab = "log";
  setBody(`<button class="btn ghost" onclick="showHome()">‹ Home</button><div class="card search"><input id="lq" placeholder="Filter by action or user ID (Enter)"></div><div id="list"><div class="empty">Loading…</div></div>`);
  const run = async () => {
    const t = $("lq").value.trim().replace(/[,()]/g, "");
    let q = sb.from("admin_logs").select("*").order("created_at", { ascending: false }).limit(100);
    if (t) q = /^[0-9a-f-]{36}$/i.test(t) ? q.or(`target_user.eq.${t},admin_id.eq.${t}`) : q.ilike("action", "%" + t + "%");
    const { data, error } = await q;
    $("list").innerHTML = error ? `<div class="msg">${esc(error.message)}</div>` : !(data || []).length ? `<div class="empty">No actions yet.</div>` :
      data.map(l => `<div class="card"><div class="name">${esc(l.action)}</div><div class="meta">${esc(when(l.created_at))}<br>Admin: ${esc(l.admin_id)}<br>Target: ${esc(l.target_user || "—")}<br>Reason: ${esc(l.reason || "—")}</div>
      ${l.old_value || l.new_value ? `<div class="meta">Before: ${esc(JSON.stringify(l.old_value))}<br>After: ${esc(JSON.stringify(l.new_value))}</div>` : ""}</div>`).join("");
  };
  $("lq").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  run();
}
const _route = route;
route = function(st){ st = st || { s: "home" }; if (st.s === "reports") { userCtx = null; return loadReports(); }
  if (st.s === "log") { userCtx = null; return loadLog(); } return _route(st); };

/* ---------- Reports ---------- */
let rStatus = "pending", rType = "all";
async function loadReports(){
  tab = "reports";
  const opts = (arr, cur) => arr.map(s => `<option ${s === cur ? "selected" : ""}>${s}</option>`).join("");
  setBody(`<button class="btn ghost" onclick="showHome()">‹ Home</button>
    <div class="card search"><div class="row"><select id="rs">${opts(["pending", "reviewed", "resolved", "dismissed", "all"], rStatus)}</select>
    <select id="rt">${opts(["all", "user", "post", "reel", "comment"], rType)}</select></div></div>
    <div id="list"><div class="empty">Loading…</div></div>`);
  $("rs").onchange = $("rt").onchange = () => { rStatus = $("rs").value; rType = $("rt").value; loadReports(); };
  let q = sb.from("reports").select("*,reporter:profiles!reports_reporter_id_fkey(name,avatar_url),target:profiles!reports_target_user_fkey(name,avatar_url)").order("created_at", { ascending: false }).limit(100);
  if (rStatus !== "all") q = q.eq("status", rStatus);
  if (rType !== "all") q = q.eq("target_type", rType);
  const { data, error } = await q;
  if (!$("list")) return;
  if (error) { $("list").innerHTML = `<div class="msg">${esc(error.message)} (run migration-admin-v2.sql)</div>`; return; }
  if (!data.length) { $("list").innerHTML = `<div class="empty">No ${rStatus === "all" ? "" : esc(rStatus) + " "}reports.</div>`; return; }
  $("list").innerHTML = data.map(r => {
    const open = r.status === "pending" || r.status === "reviewed";
    const tbl = r.target_type === "post" ? "posts" : r.target_type === "reel" ? "reels" : null;
    return `<div class="card"><div class="name">${esc(r.target_type.toUpperCase())} report · ${esc(r.status)}</div>
      <div class="meta">${esc(when(r.created_at))}</div>
      <div class="body"><b>Reason:</b> ${esc(r.reason || "—")}</div>
      <div class="row">${avatarHtml((r.reporter || {}).name, (r.reporter || {}).avatar_url)}<div class="grow meta">Reported by: ${esc((r.reporter || {}).name || "unknown")}<br>${esc(r.reporter_id || "")}</div></div>
      <div class="row" style="margin-top:8px">${avatarHtml((r.target || {}).name, (r.target || {}).avatar_url)}<div class="grow meta">Reported user: ${esc((r.target || {}).name || "unknown")}<br>${esc(r.target_user || "")}</div></div>
      <div class="meta">Target ID: ${esc(r.target_id)}</div>
      ${r.note ? `<div class="meta"><b>Admin note:</b> ${esc(r.note)}</div>` : ""}
      <div class="row" style="margin-top:10px;flex-wrap:wrap">
        ${r.target_user ? `<button class="btn sm ghost" onclick="openUser('${esc(r.target_user)}')">Open user</button>` : ""}
        ${open && r.status === "pending" ? `<button class="btn sm ghost" onclick="handleReport(${r.id},'reviewed')">Mark reviewed</button>` : ""}
        ${open ? `<button class="btn sm" onclick="handleReport(${r.id},'resolved')">Resolve</button><button class="btn sm ghost" onclick="handleReport(${r.id},'dismissed')">Dismiss</button>` : ""}
        ${open && r.target_user ? `<button class="btn sm ghost" onclick="handleReport(${r.id},'resolved',true)">Resolve + warn</button>` : ""}
        ${open && tbl ? `<button class="btn sm del" onclick="delContent('${tbl}','${esc(r.target_id)}')">Delete ${esc(r.target_type)}</button>` : ""}
      </div></div>`;
  }).join("");
}
async function handleReport(id, st, warn){
  let note = "";
  if (st !== "reviewed") { note = prompt((st === "dismissed" ? "Why dismiss" : "How resolved") + " (required):"); if (!note || !note.trim()) return; }
  try { await rpc("admin_handle_report", { p_id: id, p_status: st, p_note: note.trim(), p_warn: !!warn }); toast("Report " + st); loadReports(); } catch (e) {}
}

start();
</script>
