<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<title>Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--blue:#2457D6;--ink:#1B1F27;--mute:#5B6472;--line:#E3E6EB;--bg:#F4F5F7;--soft:#EEF0F4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg)}
header{height:60px;background:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex:none}
header h1{margin:0;font-size:24px;font-weight:700;color:var(--blue)}
main{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;padding:12px 16px}
.row{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--ink)}
.av.lg{width:56px;height:56px}
.name{font-weight:700}
.meta{font-size:13px;color:var(--mute)}
.body{margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.h2{background:#fff;padding:12px 16px 4px;font-size:17px;font-weight:700;margin:0}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:8px;font-weight:600;background:var(--blue);color:#fff}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.soft{background:#E6EDFC;color:#1A45B0}
.btns{display:flex;gap:8px;margin-top:6px}
textarea,input{width:100%;border:1px solid #D5D9E0;border-radius:10px;padding:12px;background:#fff}
textarea{resize:none;min-height:80px}
.empty{padding:24px 16px;text-align:center;color:var(--mute)}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--blue)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#auth{max-width:420px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:12px}
#auth h1{margin:0;font-size:36px;color:var(--blue)}
#auth p{margin:0 0 8px;color:var(--mute)}
#msg{color:#B42318;min-height:20px;font-size:14px}
#msg.ok{color:#18794E}
.link{background:none;border:0;color:var(--blue);font-weight:600;min-height:44px}
:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <h1>Circle</h1>
  <p id="auth-sub">Log in to see what your friends are up to.</p>
  <input id="a-name" class="hidden" placeholder="Your name" autocomplete="name" aria-label="Your name">
  <input id="a-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="a-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
  <div id="msg" role="alert"></div>
  <button class="btn" id="a-go" onclick="submitAuth()">Log in</button>
  <button class="link" id="a-switch" onclick="toggleAuth()">New here? Create an account</button>
</section>

<div id="app" class="hidden">
  <header><h1 id="title">Circle</h1></header>
  <main id="main"></main>
  <nav>
    <button id="t-home" onclick="go('home')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button id="t-friends" onclick="go('friends')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M18 14c2.5.4 4 2.2 4 5"/></svg>Friends</button>
    <button id="t-me" onclick="go('me')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Me</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://swmokmlkpkojbjevxunj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZPXOX4-iPM2xRCwt--xx1g_LB0kjXZG";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, tab = "home", signup = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#CFE0FF","#FBD9C4","#CDEBD8","#E4D9F7","#FFF0B8"];
function avatar(name, big){
  const n = name || "?";
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const ini = n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
  return `<div class="av ${big ? "lg" : ""}" style="background:${COLORS[h % COLORS.length]}">${esc(ini)}</div>`;
}
function ago(t){
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}

/* ---------- auth ---------- */
function toggleAuth(){
  signup = !signup;
  $("a-name").classList.toggle("hidden", !signup);
  $("a-go").textContent = signup ? "Create account" : "Log in";
  $("a-switch").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
  $("auth-sub").textContent = signup ? "Make an account to join your friends." : "Log in to see what your friends are up to.";
  $("msg").textContent = "";
}
function say(t, ok){ $("msg").textContent = t; $("msg").className = ok ? "ok" : ""; }
async function submitAuth(){
  const email = $("a-email").value.trim(), password = $("a-pass").value, name = $("a-name").value.trim();
  if (!email || !password) return say("Enter your email and password.");
  if (signup && !name) return say("Enter your name.");
  say("Please wait…", true);
  if (signup){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
    if (error) return say(error.message);
    if (!data.session) return say("Account created. Check your email to confirm, then log in.", true);
    boot(data.user);
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return say(error.message);
    boot(data.user);
  }
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ---------- boot ---------- */
async function boot(user){
  const { data: p } = await sb.from("profiles").select("id,name").eq("id", user.id).maybeSingle();
  if (p){ me = p; }
  else {
    const name = (user.user_metadata && user.user_metadata.name) || user.email.split("@")[0];
    const { data, error } = await sb.from("profiles").insert({ id: user.id, name }).select().single();
    if (error){ $("auth").classList.remove("hidden"); return say(error.message); }
    me = data;
  }
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  go("home");
}
function go(t){
  tab = t;
  ["home","friends","me"].forEach(x => $("t-" + x).classList.toggle("on", x === t));
  $("title").textContent = t === "home" ? "Circle" : t === "friends" ? "Friends" : "Me";
  ({ home: renderHome, friends: renderFriends, me: renderMe })[t]();
}

/* ---------- home ---------- */
async function renderHome(){
  $("main").innerHTML = `<div class="card"><textarea id="p-body" maxlength="1000" placeholder="What is on your mind?" aria-label="New post"></textarea><div class="btns"><button class="btn" onclick="addPost()">Post</button></div></div><div class="empty">Loading…</div>`;
  const { data, error } = await sb.from("posts").select("id,body,created_at,profiles(name)").order("created_at", { ascending: false }).limit(50);
  const list = error ? `<div class="empty">Could not load posts: ${esc(error.message)}</div>`
    : !data.length ? `<div class="empty">No posts yet. Write the first one.</div>`
    : data.map(p => `<div class="card"><div class="row">${avatar(p.profiles && p.profiles.name)}<div><div class="name">${esc(p.profiles && p.profiles.name)}</div><div class="meta">${ago(p.created_at)}</div></div></div><p class="body">${esc(p.body)}</p></div>`).join("");
  $("main").lastElementChild.outerHTML = list;
}
async function addPost(){
  const body = $("p-body").value.trim();
  if (!body) return;
  const { error } = await sb.from("posts").insert({ user_id: me.id, body });
  if (error) return alert(error.message);
  renderHome();
}

/* ---------- friends ---------- */
async function renderFriends(){
  $("main").innerHTML = `<div class="empty">Loading…</div>`;
  const [{ data: people }, { data: fr }] = await Promise.all([
    sb.from("profiles").select("id,name").neq("id", me.id).order("name"),
    sb.from("friendships").select("id,requester,addressee,status")
  ]);
  const byId = {}; (people || []).forEach(p => byId[p.id] = p);
  const rel = {}; (fr || []).forEach(f => rel[f.requester === me.id ? f.addressee : f.requester] = f);
  const incoming = (fr || []).filter(f => f.addressee === me.id && f.status === "pending");
  const friends = (fr || []).filter(f => f.status === "accepted");
  const others = (people || []).filter(p => !rel[p.id]);
  const person = (p, extra) => `<div class="card row">${avatar(p.name, true)}<div style="flex:1"><div class="name">${esc(p.name)}</div>${extra}</div></div>`;
  let h = "";
  if (incoming.length){
    h += `<h2 class="h2">Friend requests</h2>` + incoming.map(f => byId[f.requester] ? person(byId[f.requester], `<div class="btns"><button class="btn" onclick="answer(${f.id},'accepted')">Confirm</button><button class="btn alt" onclick="answer(${f.id},'declined')">Delete</button></div>`) : "").join("");
  }
  h += `<h2 class="h2">Your friends</h2>` + (friends.length
    ? friends.map(f => { const o = byId[f.requester === me.id ? f.addressee : f.requester]; return o ? person(o, `<div class="meta">Friends</div>`) : ""; }).join("")
    : `<div class="empty">No friends yet. Add someone below.</div>`);
  h += `<h2 class="h2">People you may know</h2>` + (others.length
    ? others.map(p => person(p, `<div class="btns"><button class="btn soft" onclick="addFriend('${p.id}')">Add friend</button></div>`)).join("")
    : `<div class="empty">No one else has joined yet. Share the link with a friend.</div>`);
  const sent = (fr || []).filter(f => f.requester === me.id && f.status === "pending");
  if (sent.length) h += `<h2 class="h2">Requests you sent</h2>` + sent.map(f => byId[f.addressee] ? person(byId[f.addressee], `<div class="meta">Waiting for a reply</div>`) : "").join("");
  $("main").innerHTML = h;
}
async function addFriend(id){
  const { error } = await sb.from("friendships").insert({ requester: me.id, addressee: id });
  if (error) alert(error.message);
  renderFriends();
}
async function answer(id, status){
  const { error } = await sb.from("friendships").update({ status }).eq("id", id);
  if (error) alert(error.message);
  renderFriends();
}

/* ---------- me ---------- */
function renderMe(){
  $("main").innerHTML = `<div class="card row">${avatar(me.name, true)}<div><div class="name">${esc(me.name)}</div><div class="meta">Your profile</div></div></div><div class="card"><button class="btn alt" onclick="logout()">Log out</button></div>`;
}

/* ---------- start ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) boot(session.user); else $("auth").classList.remove("hidden");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
