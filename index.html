<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<meta name="color-scheme" content="light dark">
<title>Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--blue:#2457D6;--blue2:#5B8CFF;--ink:#1B1F27;--mute:#667085;--line:#E6E9EF;--bg:#EEF1F7;--soft:#EEF1F6;--card:#fff;--tint:#E6EDFC;--tinttx:#1A45B0;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--ink:#EDF0F5;--mute:#98A2B3;--line:#2A303B;--bg:#0E1116;--soft:#262C37;--card:#171B22;--tint:#1E2B4A;--tinttx:#A9C2FF;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg)}
header{height:60px;background:linear-gradient(135deg,var(--blue),var(--blue2));padding:0 18px;display:flex;align-items:center;flex:none;box-shadow:0 2px 12px rgba(36,87,214,.35);position:relative;z-index:2}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;color:#fff;display:flex;align-items:center;gap:10px}
header h1::before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:inset 0 0 0 4px transparent;background:radial-gradient(circle,#fff 0 3px,transparent 3.5px)}
main{flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:12px}
#feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);padding:14px 16px;border-radius:18px;box-shadow:var(--shadow)}
#feed .card{margin-bottom:0!important}
.row{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.av.lg{width:58px;height:58px;font-size:20px}
.name{font-weight:700}
.meta{font-size:13px;color:var(--mute)}
.body{margin:10px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.h2{padding:6px 6px 0;font-size:13px;font-weight:700;margin:6px 0 -4px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.btn{min-height:44px;padding:0 22px;border:0;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 8px rgba(36,87,214,.3)}
.btn:disabled{opacity:.6}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.soft{background:var(--tint);color:var(--tinttx);box-shadow:none}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn:last-child:not(.alt){margin-left:auto}
textarea,input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,87,214,.15)}
textarea{resize:none;min-height:84px}
::placeholder{color:var(--mute);opacity:.8}
.empty{padding:28px 16px;text-align:center;color:var(--mute);background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);position:relative}
nav button.on{color:var(--blue)}
nav button.on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
@media (prefers-color-scheme:dark){nav button.on{color:var(--blue2)}nav button.on::before{background:var(--blue2)}}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body:has(#auth:not(.hidden)),body:has(#reset:not(.hidden)){background:linear-gradient(160deg,var(--blue),var(--blue2) 45%,var(--bg) 45%)}
#auth,#reset{width:calc(100% - 32px);max-width:420px;margin:40px auto 0;padding:28px 22px;display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:24px;box-shadow:0 10px 40px rgba(16,24,40,.2)}
#auth h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
#auth p{margin:0 0 8px;color:var(--mute)}
#msg{color:#B42318;min-height:20px;font-size:14px}
#msg.ok{color:#18794E}
.link{background:none;border:0;color:var(--blue);font-weight:700;min-height:44px}
@media (prefers-color-scheme:dark){.link{color:var(--blue2)}}
.post-img{display:block;width:100%;max-height:460px;object-fit:cover;border-radius:14px;margin-top:12px;background:var(--soft)}
.acts{display:flex;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.act{flex:1;min-height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--mute);border-radius:12px}
.act:active{background:var(--soft)}
.act.on{color:#E0245E}
.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on svg{fill:currentColor}
.del{margin-left:auto;background:none;border:0;color:var(--mute);min-height:44px;min-width:44px;font-size:13px;font-weight:600}
.cm{display:flex;gap:8px;margin-top:10px}
.cm .av{width:32px;height:32px;font-size:12px}
.cm .bub{background:var(--soft);border-radius:16px;padding:8px 14px;flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.cm-form{display:flex;gap:8px;margin-top:12px}
.cm-form input{flex:1;border-radius:22px}
.cm-form .btn{padding:0 18px;border-radius:22px}
.prev{position:relative;margin-top:10px}
.prev img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.prev button{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <h1>Circle</h1>
  <p id="auth-sub">Log in to see what your friends are up to.</p>
  <input id="a-name" class="hidden" placeholder="Your name" autocomplete="name" aria-label="Your name">
  <input id="a-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="a-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
  <div id="msg" role="alert"></div>
  <button class="btn" id="a-go" onclick="submitAuth()">Log in</button>
  <button class="link" id="a-switch" onclick="toggleAuth()">New here? Create an account</button>
  <button class="link" id="a-forgot" onclick="forgotPass()">Forgot password?</button>
</section>

<section id="reset" class="hidden">
  <h1 style="margin:0;font-size:30px;color:var(--blue)">New password</h1>
  <p style="margin:0 0 8px;color:var(--mute)">Choose a new password for your account.</p>
  <input id="r-pass" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" aria-label="New password">
  <div id="rmsg" role="alert" style="min-height:20px;font-size:14px;color:#B42318"></div>
  <button class="btn" onclick="saveNewPass()">Save password</button>
</section>

<div id="app" class="hidden">
  <header><h1 id="title">Circle</h1></header>
  <main id="main"></main>
  <nav>
    <button id="t-home" onclick="go('home')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button id="t-friends" onclick="go('friends')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M18 14c2.5.4 4 2.2 4 5"/></svg>Friends</button>
    <button id="t-me" onclick="go('me')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Me</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://swmokmlkpkojbjevxunj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZPXOX4-iPM2xRCwt--xx1g_LB0kjXZG";
let recovering = /type=recovery/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "post-images";

let me = null, tab = "home", signup = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["linear-gradient(135deg,#4F7CF0,#7FA6FF)","linear-gradient(135deg,#F2784B,#FFA67A)","linear-gradient(135deg,#2FA36B,#6FD4A0)","linear-gradient(135deg,#8B5CF6,#B794FF)","linear-gradient(135deg,#E5A91A,#FFD369)","linear-gradient(135deg,#E0457B,#FF86AC)"];
function avatar(name, big){
  const n = name || "?";
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const ini = n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
  return `<div class="av ${big ? "lg" : ""}" style="background:${COLORS[h % COLORS.length]}">${esc(ini)}</div>`;
}
function ago(t){
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}

/* ---------- auth ---------- */
function toggleAuth(){
  signup = !signup;
  $("a-name").classList.toggle("hidden", !signup);
  $("a-go").textContent = signup ? "Create account" : "Log in";
  $("a-switch").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
  $("auth-sub").textContent = signup ? "Make an account to join your friends." : "Log in to see what your friends are up to.";
  $("msg").textContent = "";
}
function say(t, ok){ $("msg").textContent = t; $("msg").className = ok ? "ok" : ""; }
async function submitAuth(){
  const email = $("a-email").value.trim(), password = $("a-pass").value, name = $("a-name").value.trim();
  if (!email || !password) return say("Enter your email and password.");
  if (signup && !name) return say("Enter your name.");
  say("Please wait…", true);
  if (signup){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
    if (error) return say(error.message);
    if (!data.session) return say("Account created. Check your email to confirm, then log in.", true);
    boot(data.user);
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return say(error.message);
    boot(data.user);
  }
}
async function forgotPass(){
  const email = $("a-email").value.trim();
  if (!email) return say("Type your email above first, then tap Forgot password.");
  say("Please wait…", true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/" });
  if (error) return say(error.message);
  say("Done. Check your email for the reset link.", true);
}
async function saveNewPass(){
  const password = $("r-pass").value;
  if (password.length < 6) { $("rmsg").textContent = "Use 6 or more characters."; return; }
  const { error } = await sb.auth.updateUser({ password });
  if (error) { $("rmsg").textContent = error.message; return; }
  history.replaceState(null, "", location.pathname);
  location.reload();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* ---------- boot ---------- */
async function boot(user){
  const { data: p } = await sb.from("profiles").select("id,name,bio").eq("id", user.id).maybeSingle();
  if (p){ me = p; }
  else {
    const name = (user.user_metadata && user.user_metadata.name) || user.email.split("@")[0];
    const { data, error } = await sb.from("profiles").insert({ id: user.id, name }).select().single();
    if (error){ $("auth").classList.remove("hidden"); return say(error.message); }
    me = data;
  }
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  go("home");
}
function go(t){
  tab = t;
  ["home","friends","me"].forEach(x => $("t-" + x).classList.toggle("on", x === t));
  $("title").textContent = t === "home" ? "Circle" : t === "friends" ? "Friends" : "Me";
  ({ home: renderHome, friends: renderFriends, me: renderMe })[t]();
}

/* ---------- home ---------- */
const ICON_HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>`;
const ICON_CHAT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>`;
let feed = [], openCm = new Set(), cmts = {}, pickedFile = null, previewUrl = null;

async function renderHome(){
  pickedFile = null;
  $("main").innerHTML = `<div class="card"><textarea id="p-body" maxlength="1000" placeholder="What is on your mind?" aria-label="New post"></textarea><div id="prev"></div><input id="p-file" type="file" accept="image/*" class="hidden" onchange="pickPhoto(this)"><div class="btns"><button class="btn alt" onclick="$('p-file').click()">📷 Photo</button><button class="btn" id="p-go" onclick="addPost()">Post</button></div></div><div id="feed"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from("posts")
    .select("id,user_id,body,image_url,created_at,profiles!user_id(name),likes(user_id),comments(id)")
    .order("created_at", { ascending: false }).limit(50);
  if (tab !== "home") return;
  if (error) { $("feed").innerHTML = `<div class="empty">Could not load posts: ${esc(error.message)}</div>`; return; }
  feed = data; openCm = new Set(); cmts = {};
  drawFeed();
}
function drawFeed(){
  $("feed").innerHTML = !feed.length ? `<div class="empty">No posts yet. Write the first one.</div>`
    : feed.map(postHtml).join("");
}
function drawPost(id){
  const p = feed.find(x => x.id === id), el = $("post-" + id);
  if (p && el) el.outerHTML = postHtml(p);
}
function postHtml(p){
  const name = p.profiles && p.profiles.name;
  const liked = p.likes.some(l => l.user_id === me.id);
  const count = cmts[p.id] ? cmts[p.id].length : p.comments.length;
  let h = `<div class="card" id="post-${p.id}" ><div class="row">${avatar(name)}<div><div class="name">${esc(name)}</div><div class="meta">${ago(p.created_at)}</div></div>${p.user_id === me.id ? `<button class="del" onclick="delPost(${p.id})" aria-label="Delete post">Delete</button>` : ""}</div>`;
  if (p.body) h += `<p class="body">${esc(p.body)}</p>`;
  if (p.image_url) h += `<img class="post-img" src="${esc(p.image_url)}" alt="Photo" loading="lazy">`;
  h += `<div class="acts"><button class="act ${liked ? "on" : ""}" onclick="toggleLike(${p.id})" aria-label="Like">${ICON_HEART}${p.likes.length || ""}</button><button class="act" onclick="toggleCm(${p.id})" aria-label="Comments">${ICON_CHAT}${count || ""}</button></div>`;
  if (openCm.has(p.id)){
    const list = cmts[p.id];
    h += list ? list.map(c => `<div class="cm">${avatar(c.profiles && c.profiles.name)}<div style="flex:1;min-width:0"><div class="bub"><div class="name">${esc(c.profiles && c.profiles.name)}</div>${esc(c.body)}</div><div class="meta" style="margin:2px 0 0 12px">${ago(c.created_at)}${c.user_id === me.id ? ` · <button class="link" style="min-height:32px;font-size:13px" onclick="delCm(${p.id},${c.id})">Delete</button>` : ""}</div></div></div>`).join("") : `<div class="meta" style="margin-top:10px">Loading…</div>`;
    h += `<div class="cm-form"><input id="c-${p.id}" maxlength="500" placeholder="Write a comment…" aria-label="Write a comment" onkeydown="if(event.key==='Enter')addCm(${p.id})"><button class="btn" onclick="addCm(${p.id})">Send</button></div>`;
  }
  return h + `</div>`;
}
async function toggleLike(id){
  const p = feed.find(x => x.id === id); if (!p) return;
  const liked = p.likes.some(l => l.user_id === me.id);
  const { error } = liked
    ? await sb.from("likes").delete().eq("post_id", id).eq("user_id", me.id)
    : await sb.from("likes").insert({ post_id: id, user_id: me.id });
  if (error) return alert(error.message);
  p.likes = liked ? p.likes.filter(l => l.user_id !== me.id) : [...p.likes, { user_id: me.id }];
  drawPost(id);
}
async function toggleCm(id){
  if (openCm.has(id)){ openCm.delete(id); return drawPost(id); }
  openCm.add(id); drawPost(id);
  if (!cmts[id]) await loadCm(id);
}
async function loadCm(id){
  const { data, error } = await sb.from("comments").select("id,user_id,body,created_at,profiles(name)").eq("post_id", id).order("created_at");
  if (error) return alert(error.message);
  cmts[id] = data; drawPost(id);
}
async function addCm(id){
  const el = $("c-" + id), body = el && el.value.trim();
  if (!body) return;
  const { error } = await sb.from("comments").insert({ post_id: id, user_id: me.id, body });
  if (error) return alert(error.message);
  await loadCm(id);
  const n = $("c-" + id); if (n) n.focus();
}
async function delCm(pid, id){
  if (!confirm("Delete this comment?")) return;
  const { error } = await sb.from("comments").delete().eq("id", id);
  if (error) return alert(error.message);
  cmts[pid] = (cmts[pid] || []).filter(c => c.id !== id); drawPost(pid);
}
async function delPost(id){
  const p = feed.find(x => x.id === id); if (!p) return;
  if (!confirm("Delete this post?")) return;
  const { error } = await sb.from("posts").delete().eq("id", id);
  if (error) return alert(error.message);
  if (p.image_url){
    const i = p.image_url.indexOf("/" + BUCKET + "/");
    if (i > -1) sb.storage.from(BUCKET).remove([decodeURIComponent(p.image_url.slice(i + BUCKET.length + 2))]);
  }
  feed = feed.filter(x => x.id !== id); drawFeed();
}
function pickPhoto(input){
  const f = input.files && input.files[0];
  if (!f) return;
  pickedFile = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  $("prev").innerHTML = `<div class="prev"><img src="${previewUrl}" alt="Selected photo"><button onclick="clearPhoto()" aria-label="Remove photo">✕</button></div>`;
}
function clearPhoto(){ pickedFile = null; $("prev").innerHTML = ""; $("p-file").value = ""; }
async function shrink(file, max = 1280){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    return blob || file;
  } catch (e) { return file; }
}
async function addPost(){
  const body = $("p-body").value.trim();
  if (!body && !pickedFile) return;
  const btn = $("p-go"); btn.disabled = true; btn.textContent = "Posting…";
  let image_url = null;
  if (pickedFile){
    const blob = await shrink(pickedFile);
    const path = `${me.id}/${Date.now()}.jpg`;
    const { error: ue } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if (ue){ btn.disabled = false; btn.textContent = "Post"; return alert("Photo upload failed: " + ue.message); }
    image_url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("posts").insert({ user_id: me.id, body, image_url });
  if (error){ btn.disabled = false; btn.textContent = "Post"; return alert(error.message); }
  renderHome();
}

/* ---------- friends ---------- */
async function renderFriends(){
  $("main").innerHTML = `<div class="empty">Loading…</div>`;
  const [{ data: people }, { data: fr }] = await Promise.all([
    sb.from("profiles").select("id,name,bio").neq("id", me.id).order("name"),
    sb.from("friendships").select("id,requester,addressee,status")
  ]);
  const byId = {}; (people || []).forEach(p => byId[p.id] = p);
  const rel = {}; (fr || []).forEach(f => rel[f.requester === me.id ? f.addressee : f.requester] = f);
  const incoming = (fr || []).filter(f => f.addressee === me.id && f.status === "pending");
  const friends = (fr || []).filter(f => f.status === "accepted");
  const others = (people || []).filter(p => !rel[p.id]);
  const person = (p, extra) => `<div class="card row">${avatar(p.name, true)}<div style="flex:1"><div class="name">${esc(p.name)}</div>${p.bio ? `<div class="meta">${esc(p.bio)}</div>` : ""}${extra}</div></div>`;
  let h = "";
  if (incoming.length){
    h += `<h2 class="h2">Friend requests</h2>` + incoming.map(f => byId[f.requester] ? person(byId[f.requester], `<div class="btns"><button class="btn" onclick="answer(${f.id},'accepted')">Confirm</button><button class="btn alt" onclick="answer(${f.id},'declined')">Delete</button></div>`) : "").join("");
  }
  h += `<h2 class="h2">Your friends</h2>` + (friends.length
    ? friends.map(f => { const o = byId[f.requester === me.id ? f.addressee : f.requester]; return o ? person(o, `<div class="meta">Friends</div>`) : ""; }).join("")
    : `<div class="empty">No friends yet. Add someone below.</div>`);
  h += `<h2 class="h2">People you may know</h2>` + (others.length
    ? others.map(p => person(p, `<div class="btns"><button class="btn soft" onclick="addFriend('${p.id}')">Add friend</button></div>`)).join("")
    : `<div class="empty">No one else has joined yet. Share the link with a friend.</div>`);
  const sent = (fr || []).filter(f => f.requester === me.id && f.status === "pending");
  if (sent.length) h += `<h2 class="h2">Requests you sent</h2>` + sent.map(f => byId[f.addressee] ? person(byId[f.addressee], `<div class="meta">Waiting for a reply</div>`) : "").join("");
  $("main").innerHTML = h;
}
async function addFriend(id){
  const { error } = await sb.from("friendships").insert({ requester: me.id, addressee: id });
  if (error) alert(error.message);
  renderFriends();
}
async function answer(id, status){
  const { error } = await sb.from("friendships").update({ status }).eq("id", id);
  if (error) alert(error.message);
  renderFriends();
}

/* ---------- me ---------- */
function renderMe(){
  $("main").innerHTML = `<div class="card"><div class="row">${avatar(me.name, true)}<div><div class="name">${esc(me.name)}</div><div class="meta">Your profile</div></div></div>
  <label class="fld" for="m-name">Name</label><input id="m-name" maxlength="60" value="${esc(me.name)}">
  <label class="fld" for="m-bio">About you</label><textarea id="m-bio" maxlength="200" placeholder="A short bio (optional)">${esc(me.bio || "")}</textarea>
  <div id="m-msg" class="meta" style="min-height:20px;margin-top:6px"></div>
  <div class="btns"><button class="btn" onclick="saveProfile()">Save</button></div></div>
  <div class="card"><button class="btn alt" onclick="logout()">Log out</button></div>`;
}
async function saveProfile(){
  const name = $("m-name").value.trim(), bio = $("m-bio").value.trim();
  if (!name){ $("m-msg").textContent = "Name cannot be empty."; return; }
  const { data, error } = await sb.from("profiles").update({ name, bio }).eq("id", me.id).select("id,name,bio").single();
  if (error){ $("m-msg").textContent = error.message; return; }
  me = data; renderMe(); $("m-msg").textContent = "Saved ✓";
}

/* ---------- start ---------- */
(async () => {
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; $("auth").classList.add("hidden"); $("app").classList.add("hidden"); $("reset").classList.remove("hidden"); } });
  const { data: { session } } = await sb.auth.getSession();
  if (recovering) { $("reset").classList.remove("hidden"); return; }
  if (session) boot(session.user); else $("auth").classList.remove("hidden");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
