<html lang="en">
<head>

<style>
:root{--blue:#2457D6;--blue2:#5B8CFF;--ink:#1F2A44;--mute:#667085;--line:#E6E9EF;--bg:#EEF1F7;--soft:#EEF1F6;--card:#fff;--tint:#E6EDFC;--tinttx:#1A45B0;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg)}
header{background:radial-gradient(circle at 78% -10%,rgba(255,255,255,.28),transparent 42%),radial-gradient(circle at 100% 100%,rgba(120,170,255,.45),transparent 50%),linear-gradient(135deg,#1747C9,#2F6BFF 60%,#4C8DFF);padding:calc(10px + env(safe-area-inset-top)) 16px 22px;display:flex;align-items:center;gap:10px;flex:none;border-radius:0 0 26px 26px;position:relative;z-index:2;box-shadow:0 6px 20px rgba(36,87,214,.3)}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px;color:#fff;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header h1::before{content:"";flex:none;width:34px;height:34px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle,#fff 0 4px,transparent 4.5px)}
.hbtns{display:flex;align-items:center;gap:8px}
.hb{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#F04438;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #2F6BFF}
.hav .av{width:46px;height:46px;border:2.5px solid rgba(255,255,255,.85);font-size:16px}
main{flex:1;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:12px}
#feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);padding:14px 16px;border-radius:18px;box-shadow:var(--shadow)}
#feed .card{margin-bottom:0!important}
.row{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.av.lg{width:58px;height:58px;font-size:20px}
.name{font-weight:700}
.meta{font-size:13px;color:var(--mute)}
.body{margin:10px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.h2{padding:6px 6px 0;font-size:13px;font-weight:700;margin:6px 0 -4px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.btn{min-height:44px;padding:0 22px;border:0;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 8px rgba(36,87,214,.3)}
.btn:disabled{opacity:.6}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.soft{background:var(--tint);color:var(--tinttx);box-shadow:none}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn:last-child:not(.alt){margin-left:auto}
textarea,input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,87,214,.15)}
textarea{resize:none;min-height:84px}
::placeholder{color:var(--mute);opacity:.8}
.empty{padding:28px 16px;text-align:center;color:var(--mute);background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
nav{display:flex;background:var(--card);margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:26px;box-shadow:0 4px 24px rgba(16,24,40,.16);flex:none;overflow:hidden}
nav button{flex:1;height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);position:relative}
nav button.on{color:var(--blue)}
nav button.on::before{content:"";position:absolute;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--blue)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body:has(#auth:not(.hidden)),body:has(#reset:not(.hidden)){background:linear-gradient(160deg,var(--blue),var(--blue2) 45%,var(--bg) 45%)}
#auth,#reset{width:calc(100% - 32px);max-width:420px;margin:40px auto 0;padding:28px 22px;display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:24px;box-shadow:0 10px 40px rgba(16,24,40,.2)}
#auth h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
#auth p{margin:0 0 8px;color:var(--mute)}
#msg{color:#B42318;min-height:20px;font-size:14px}
#msg.ok{color:#18794E}
.link{background:none;border:0;color:var(--blue);font-weight:700;min-height:44px}
.post-img{display:block;width:100%;max-height:460px;object-fit:cover;border-radius:14px;margin-top:12px;background:var(--soft)}
.acts{display:flex;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.act{flex:1;min-width:0;min-height:46px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:4px;padding:0;font-weight:700;font-size:14px;color:var(--mute);border-radius:12px}
.act:active{background:var(--soft)}
.act.on{color:var(--blue)}
.act.sv{color:var(--blue)}
.act.sv svg{fill:currentColor}
.act span{font-size:12.5px}
.acts{gap:0}
.act svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.on svg{fill:currentColor}
.del{margin-left:auto;background:none;border:0;color:var(--mute);min-height:44px;min-width:44px;font-size:13px;font-weight:600}
.cm{display:flex;gap:8px;margin-top:10px}
.cm .av{width:32px;height:32px;font-size:12px}
.cm .bub{background:var(--soft);border-radius:16px;padding:8px 14px;flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.cm-form{display:flex;gap:8px;margin-top:12px}
.cm-form input{flex:1;border-radius:22px}
.cm-form .btn{padding:0 18px;border-radius:22px}
.prev{position:relative;margin-top:10px}
.prev img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.prev button{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
.av.xl{width:96px;height:96px;font-size:34px}
img.av{object-fit:cover;background:var(--soft)}
.lnk{cursor:pointer}
.avwrap{position:relative;flex:none}
.cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;border:3px solid var(--card);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0}
.back{background:none;border:0;color:var(--blue);font-weight:700;min-height:44px;padding:0 4px;text-align:left;align-self:flex-start}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pf .nm{font-size:22px;font-weight:800;margin-top:8px}
#feed .acts{border-top:1px solid var(--line)}
.ring{flex:none;padding:2.5px;border-radius:50%;background:conic-gradient(#2457D6,#7FA6FF,#F2A94B,#2FA36B,#2457D6)}
.ring .av{border:2.5px solid var(--card);width:42px;height:42px}
.react{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--mute)}
.lkc{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;vertical-align:middle;margin-right:6px}
.lkc svg{width:14px;height:14px;fill:currentColor}
.comp .row{align-items:flex-start}
.comp textarea{min-height:46px;height:46px;border:0;background:var(--soft);border-radius:24px;padding:12px 18px;overflow:hidden}
.cbar{display:flex;margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.cbar button{flex:1;min-height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border-radius:14px}
.cbar button+button{border-left:1px solid var(--line);border-radius:0}
.cbar button:disabled{opacity:.5}
.cbar svg{width:26px;height:26px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.globe{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-2px}
:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}

/* ---------- new look (mockup style) ---------- */
:root{--bg:#F1F5FD;--soft:#F1F4FA}
body{background:var(--bg)}
header{background:linear-gradient(160deg,#1240C4 0%,#1F5CF0 55%,#2F7BFF 100%);border-radius:0;box-shadow:none;overflow:hidden;padding-bottom:44px;margin-bottom:-28px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(to bottom,rgba(241,245,253,0),var(--bg));pointer-events:none}
header>*{position:relative;z-index:1}
header>.hwave{position:absolute;z-index:0;left:0;top:0;width:100%;height:100%;pointer-events:none}
header h1{font-size:34px;letter-spacing:-.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hb{width:48px;height:48px;background:rgba(255,255,255,.14)}
.badge{border-color:#1F5CF0}

main{position:relative;z-index:2;padding-top:2px}

.cbar{border-top:0;gap:8px;padding-top:0;margin-top:14px}
.cbar button{background:#F3F6FC;border-radius:18px;min-height:52px;font-size:16px;color:var(--ink)}
.cbar button+button{border-left:0;border-radius:18px}
.cbar svg{width:28px;height:28px}
.ring{position:relative;padding:3px}
.ring .av{width:48px;height:48px}
.ring.me::after{content:"";position:absolute;right:-1px;bottom:-1px;width:16px;height:16px;border-radius:50%;background:#2F7BFF;border:3px solid #fff}
#feed .name{font-size:18px;display:inline-flex;align-items:center;gap:5px}
.vf{width:19px;height:19px;flex:none}
#feed .meta{font-size:14.5px}
.body{font-size:17px;font-weight:600;margin-top:12px}
.post-img{border-radius:22px;max-height:520px}
.react{margin-top:14px;font-size:14.5px;font-weight:600}
.rxs{display:inline-flex;vertical-align:middle;margin-right:8px}
.rx{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;margin-left:-9px;color:#fff}
.rx:first-child{margin-left:0}
.rx svg{width:14px;height:14px;fill:currentColor}
.rx.r1{background:#2F6BFF}.rx.r2{background:#F0364F}.rx.r3{background:#FFC62E}
.react .lnk+.lnk{margin-left:10px}
.acts{justify-content:space-between;margin-top:12px;padding-top:6px}
.act{flex:none;padding:0 6px;gap:5px;font-size:14.5px}
.act svg{width:24px;height:24px}
.act span{font-size:14.5px}

@media(max-width:380px){.act span{font-size:13px}.act svg{width:21px;height:21px}}
nav{margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:30px;box-shadow:0 6px 28px rgba(16,24,40,.14)}

.soon{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}

.soon p{margin:0;color:var(--mute);max-width:260px}
/* ---------- profile page ---------- */
main>*{flex-shrink:0}
.pcard{padding:0;overflow:hidden}
.pcover{position:relative;height:158px;background:linear-gradient(160deg,#1240C4,#1F5CF0 55%,#2F7BFF);overflow:hidden}
.pcover svg.cw,.pcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.pbio{max-width:310px;color:var(--ink);opacity:.82;margin-top:2px;white-space:pre-wrap;word-break:break-word}

.pbtns{display:flex;gap:8px;width:100%;margin-top:14px}

.pbtns .meta{flex:1;text-align:center;align-self:center;font-weight:700;font-size:14.5px}
.ctitle{font-size:18px;font-weight:800;margin-bottom:4px;display:flex;align-items:baseline;justify-content:space-between}

.intro .swoosh{position:absolute;top:0;right:0;width:120px;height:74px;pointer-events:none}
.ihead{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:6px;position:relative}
.ihead i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1F5CF0,#4C8DFF);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.ihead i .ic{width:19px;height:19px}
.irow .ico{width:38px;height:38px;border-radius:50%;background:#EEF1F8;color:#4B5B84;font-size:inherit}
.irow .ico .ic{width:20px;height:20px}
.intro .btn.soft{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;background:#E9EEFA}
.intro .btn.soft .ic{color:#2F6BFF}
.seg{background:var(--card);border-radius:26px;padding:6px;gap:6px;box-shadow:0 4px 16px rgba(36,87,214,.1)}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:20px;background:#EEF2FB;color:#33415F;font-size:15.5px}
.seg button .ic{width:22px;height:22px}
.seg button.on{background:linear-gradient(135deg,#1747C9,#2F6BFF);color:#fff;box-shadow:0 4px 12px rgba(36,87,214,.35)}
@media(max-width:370px){.seg button{font-size:13.5px;gap:4px}.seg button .ic{width:18px;height:18px}}
.pgrid{gap:8px;border-radius:0;overflow:visible}
.pgrid img,.pgrid .ptxt{border-radius:18px;box-shadow:0 3px 10px rgba(36,87,214,.14)}
.ptxt{aspect-ratio:1;background:linear-gradient(135deg,#2F6BFF,#7FA6FF);color:#fff;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13.5px;overflow:hidden;cursor:pointer}
.ptxt span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
</style>
</head>
<body>

<section id="auth" class="hidden">
  <h1>Circle</h1>
  <p id="auth-sub">Log in to see what your friends are up to.</p>
  <input id="a-name" class="hidden" placeholder="Your name" autocomplete="name" aria-label="Your name">
  <input id="a-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="a-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" aria-label="Password">
  <div id="msg" role="alert"></div>
  <button class="btn" id="a-go" onclick="submitAuth()">Log in</button>
  <button class="link" id="a-switch" onclick="toggleAuth()">New here? Create an account</button>
  <button class="link" id="a-forgot" onclick="forgotPass()">Forgot password?</button>
</section>

<section id="reset" class="hidden">
  <h1 style="margin:0;font-size:30px;color:var(--blue)">New password</h1>
  <p style="margin:0 0 8px;color:var(--mute)">Choose a new password for your account.</p>
  <input id="r-pass" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" aria-label="New password">
  <div id="rmsg" role="alert" style="min-height:20px;font-size:14px;color:#B42318"></div>
  <button class="btn" onclick="saveNewPass()">Save password</button>
</section>

<div id="app" class="hidden">
  <header>
    <svg class="hwave" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true"><path d="M215 0C235 62 330 78 400 38V0z" fill="rgba(90,165,255,.42)"/><path d="M0 120C90 90 170 150 260 112S370 86 400 100V150H0z" fill="rgba(255,255,255,.07)"/><path d="M300 0C300 40 350 60 400 62V0z" fill="rgba(255,255,255,.08)"/></svg>
    <h1 id="title">Circle</h1>
    <div class="hbtns">
      <button class="hb" onclick="go('search')" aria-label="Search people"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="hb" onclick="go('friends')" aria-label="Friend requests"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="badge" class="badge hidden"></span></button>
      <span class="hav" id="h-av"></span>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="t-home" onclick="go('home')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button id="t-friends" onclick="go('friends')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M18 14c2.5.4 4 2.2 4 5"/></svg>Friends</button>
    <button id="t-reels" onclick="go('reels')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Reels</button>
    <button id="t-market" onclick="go('market')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9c0 1.7 1.3 3 2.7 3S9.3 10.7 9.3 9c0 1.7 1.3 3 2.7 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3S20 10.7 20 9"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/></svg>Marketplace</button>
    <button id="t-me" onclick="go('me')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Me</button>
  </nav>
</div>

<div id="lb" class="hidden" onclick="closeLb()"><img id="lb-img" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://swmokmlkpkojbjevxunj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZPXOX4-iPM2xRCwt--xx1g_LB0kjXZG";
let recovering = /type=recovery/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "post-images";

let me = null, tab = "home", signup = false;
const TABS = ["home","friends","reels","market","me"];
const VERIFIED = ["circle"]; /* names that get the blue tick */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["linear-gradient(135deg,#4F7CF0,#7FA6FF)","linear-gradient(135deg,#F2784B,#FFA67A)","linear-gradient(135deg,#2FA36B,#6FD4A0)","linear-gradient(135deg,#8B5CF6,#B794FF)","linear-gradient(135deg,#E5A91A,#FFD369)","linear-gradient(135deg,#E0457B,#FF86AC)"];
function avatar(name, big, url, uid){
  const n = name || "?";
  const cls = "av " + (big === "xl" ? "xl" : big ? "lg" : "") + (uid ? " lnk" : "");
  const click = uid ? ` onclick="openProfile('${uid}')"` : "";
  if (url) return `<img class="${cls}" src="${esc(url)}" alt="${esc(n)}"${click}>`;
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const ini = n.trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
  return `<div class="${cls}" style="background:${COLORS[h % COLORS.length]}"${click}>${esc(ini)}</div>`;
}
function ago(t){
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return "Just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}

/* ---------- auth ---------- */
function toggleAuth(){
  signup = !signup;
  $("a-name").classList.toggle("hidden", !signup);
  $("a-go").textContent = signup ? "Create account" : "Log in";
  $("a-switch").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
  $("auth-sub").textContent = signup ? "Make an account to join your friends." : "Log in to see what your friends are up to.";
  $("msg").textContent = "";
}
function say(t, ok){ $("msg").textContent = t; $("msg").className = ok ? "ok" : ""; }
async function submitAuth(){
  const email = $("a-email").value.trim(), password = $("a-pass").value, name = $("a-name").value.trim();
  if (!email || !password) return say("Enter your email and password.");
  if (signup && !name) return say("Enter your name.");
  say("Please wait…", true);
  if (signup){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
    if (error) return say(error.message);
    if (!data.session) return say("Account created. Check your email to confirm, then log in.", true);
    boot(data.user);
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return say(error.message);
    boot(data.user);
  }
}
async function forgotPass(){
  const email = $("a-email").value.trim();
  if (!email) return say("Type your email above first, then tap Forgot password.");
  say("Please wait…", true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/" });
  if (error) return say(error.message);
  say("Done. Check your email for the reset link.", true);
}
async function saveNewPass(){
  const password = $("r-pass").value;
  if (password.length < 6) { $("rmsg").textContent = "Use 6 or more characters."; return; }
  const { error } = await sb.auth.updateUser({ password });
  if (error) { $("rmsg").textContent = error.message; return; }
  history.replaceState(null, "", location.pathname);
  location.reload();
}
async function logout(){ await sb.auth.signOut(); try { history.replaceState(null, ""); } catch (e) {} location.reload(); }

/* ---------- boot ---------- */
async function boot(user){
  const { data: p } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (p){ me = p; }
  else {
    const name = (user.user_metadata && user.user_metadata.name) || user.email.split("@")[0];
    const { data, error } = await sb.from("profiles").insert({ id: user.id, name }).select().single();
    if (error){ $("auth").classList.remove("hidden"); return say(error.message); }
    me = data;
  }
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  updateHeader();
  const st = history.state && history.state.t ? history.state : { t: "home", n: 0 };
  try { history.replaceState(st, ""); } catch (e) {}
  show(st);
}
function updateHeader(){ $("h-av").innerHTML = avatar(me.name, false, me.avatar_url, me.id); }
async function refreshBell(){
  const { count } = await sb.from("friendships").select("id", { count: "exact", head: true }).eq("addressee", me.id).eq("status", "pending");
  const b = $("badge"); b.textContent = count > 9 ? "9+" : count; b.classList.toggle("hidden", !count);
}
/* ---------- navigation (with phone Back button support) ---------- */
let cur = null;
const TITLES = { home: "Circle", friends: "Friends", reels: "Reels", market: "Marketplace", me: "My profile", profile: "Profile", edit: "Edit profile", saved: "Saved", post: "Post", search: "Search" };
function show(v, keep){
  cur = v; tab = v.t;
  closeLb();
  const hl = v.t === "edit" ? "me" : v.t;
  TABS.forEach(x => $("t-" + x).classList.toggle("on", x === hl));
  $("title").textContent = TITLES[v.t] || "Circle";
  $("title").classList.toggle("long", ($("title").textContent || "").length > 8);
  if (!keep) $("main").scrollTop = 0;
  refreshBell();
  if (v.t === "profile"){ viewId = v.id; renderProfile(v.id); }
  else if (v.t === "me") renderProfile(me.id);
  else if (v.t === "edit") renderEdit();
  else if (v.t === "saved") renderSaved();
  else if (v.t === "post") renderPost(v.id);
  else ({ home: renderHome, friends: renderFriends, reels: () => renderSoon(v.t), market: () => renderSoon(v.t), search: renderSearch })[v.t]();
}
function navTo(v, replace){
  const n0 = (history.state && history.state.n) || 0;
  v.n = replace ? n0 : n0 + 1;
  try { history[replace ? "replaceState" : "pushState"](v, ""); } catch (e) {}
  show(v);
}
function go(t){ navTo({ t }, !!(cur && cur.t === t)); }
function openProfile(id){ if (id === me.id) return go("me"); navTo({ t: "profile", id }, !!(cur && cur.t === "profile" && cur.id === id)); }
function openSaved(){ navTo({ t: "saved" }); }
function openEdit(){ navTo({ t: "edit" }); }
function openPost(id){ navTo({ t: "post", id }); }
function goBack(){ if (history.state && history.state.n > 0) history.back(); else navTo({ t: "home" }, true); }
function rerender(){ if (cur) show(cur, true); }
window.addEventListener("popstate", e => { if (me) show(e.state && e.state.t ? e.state : { t: "home", n: 0 }); });
function openPhoto(url){ $("lb-img").src = url; $("lb").classList.remove("hidden"); }
function closeLb(){ const l = $("lb"); if (l) l.classList.add("hidden"); }
let viewId = null;

/* ---------- home ---------- */
const ICON_THUMB = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM7 11l4-8a2.5 2.5 0 0 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>`;
const ICON_CHAT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></svg>`;
const ICON_SHARE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l7 6-7 6v-4c-6 0-9 2-11 6 1-7 4-11 11-12z"/></svg>`;
const ICON_SAVE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>`;
const ICON_HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>`;
const ICON_VERIFIED = `<svg class="vf" viewBox="0 0 24 24" aria-label="Verified"><path fill="#2F6BFF" d="M12 1.8l2.6 1.9 3.200-.1 1 3 2.600 1.900-.9 3.100.9 3.100-2.600 1.900-1 3-3.200-.1L12 22.200l-2.600-1.900-3.200.1-1-3L2.600 15.500l.9-3.100-.9-3.100 2.600-1.900 1-3 3.200.1z"/><path d="M8 12.200l2.800 2.800 5.200-5.600" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_GLOBE = `<svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>`;
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("circle_saved") || "[]")); } catch (e) {}
let feed = [], openCm = new Set(), cmts = {}, pickedFile = null, previewUrl = null;

async function renderHome(){
  pickedFile = null;
  $("main").innerHTML = `<div class="card comp"><div class="row"><span class="avwrap">${avatar(me.name, false, me.avatar_url)}<i class="dot"></i></span><textarea id="p-body" rows="1" maxlength="1000" placeholder="What is on your mind?" aria-label="New post" oninput="this.style.height='auto';this.style.height=Math.max(56,this.scrollHeight)+'px'" style="flex:1"></textarea></div><div id="prev"></div><input id="p-file" type="file" accept="image/*" class="hidden" onchange="pickPhoto(this)">
  <div class="cbar">
   <button onclick="$('p-file').click()"><svg viewBox="0 0 24 24" stroke="#2457D6"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Photo</button>
   <button onclick="go('friends')"><svg viewBox="0 0 24 24" stroke="#8B5CF6"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M18 14c2.5.4 4 2.2 4 5"/></svg>Friends</button>
   <button id="p-go" onclick="addPost()"><svg viewBox="0 0 24 24" stroke="#F29A1F"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>Post</button>
  </div></div><div id="feed"><div class="empty">Loading…</div></div>`;
  loadFeed(null);
}
async function loadFeed(userId, ids){
  let q = sb.from("posts")
    .select("id,user_id,body,image_url,created_at,profiles!user_id(name,avatar_url),likes(user_id),comments(id)")
    .order("created_at", { ascending: false }).limit(50);
  if (userId) q = q.eq("user_id", userId);
  if (ids){ if (!ids.length){ feed = []; $("feed").innerHTML = `<div class="empty">Nothing saved yet. Tap Save on a post.</div>`; return; } q = q.in("id", ids); }
  const { data, error } = await q;
  if (!$("feed")) return;
  if (error) { $("feed").innerHTML = `<div class="empty">Could not load posts: ${esc(error.message)}</div>`; return; }
  feed = data; openCm = new Set(); cmts = {};
  drawFeed();
  if (userId && $("st-likes")) $("st-likes").textContent = feed.reduce((a, p) => a + p.likes.length, 0);
}
let pfTab = "posts";
function drawFeed(){
  if (tab === "me" || tab === "profile"){
    if (pfTab === "videos"){ $("feed").innerHTML = `<div class="empty">Videos are coming soon.</div>`; return; }
    const list = pfTab === "photos" ? feed.filter(p => p.image_url) : feed;
    if (!list.length){ $("feed").innerHTML = `<div class="empty">${pfTab === "photos" ? "No photos yet." : "No posts yet."}</div>`; return; }
    $("feed").innerHTML = `<div class="pgrid">${list.map(p => p.image_url
      ? `<img src="${esc(p.image_url)}" alt="Photo" loading="lazy" onclick="${pfTab === "photos" ? "openPhoto(this.src)" : `openPost(${p.id})`}">`
      : `<div class="ptxt" onclick="openPost(${p.id})"><span>${esc(p.body)}</span></div>`).join("")}</div>`;
    return;
  }
  $("feed").innerHTML = !feed.length ? `<div class="empty">No posts here yet.</div>`
    : feed.map(postHtml).join("");
}
function drawPost(id){
  const p = feed.find(x => x.id === id), el = $("post-" + id);
  if (p && el) el.outerHTML = postHtml(p);
}
function postHtml(p){
  const name = p.profiles && p.profiles.name, pav = p.profiles && p.profiles.avatar_url;
  const liked = p.likes.some(l => l.user_id === me.id), n = p.likes.length;
  const count = cmts[p.id] ? cmts[p.id].length : p.comments.length;
  let h = `<div class="card" id="post-${p.id}"><div class="row"><div class="ring${p.user_id === me.id ? " me" : ""}">${avatar(name, false, pav, p.user_id)}</div><div style="flex:1;min-width:0"><div class="name lnk" onclick="openProfile('${p.user_id}')">${esc(name)}${VERIFIED.includes(String(name || "").toLowerCase()) ? ICON_VERIFIED : ""}</div><div class="meta">${ago(p.created_at)} · ${ICON_GLOBE}</div></div>${p.user_id === me.id ? `<button class="del" onclick="delPost(${p.id})" aria-label="Delete post" style="font-size:22px;letter-spacing:1px;line-height:1">•••</button>` : ""}</div>`;
  if (p.body) h += `<p class="body">${esc(p.body)}</p>`;
  if (p.image_url) h += `<img class="post-img" src="${esc(p.image_url)}" alt="Photo" loading="lazy" onclick="openPhoto(this.src)">`;
  if (n || count) h += `<div class="react"><span>${n ? `<span class="rxs"><i class="rx r1">${ICON_THUMB}</i><i class="rx r2">${ICON_HEART}</i><i class="rx r3">😮</i></span>${n}` : ""}</span><span class="lnk" onclick="toggleCm(${p.id})">${count ? count + (count > 1 ? " comments" : " comment") : ""}</span></div>`;
  h += `<div class="acts"><button class="act ${liked ? "on" : ""}" onclick="toggleLike(${p.id})" aria-label="Like">${ICON_THUMB}<span>Like</span></button><button class="act" onclick="toggleCm(${p.id})" aria-label="Comment">${ICON_CHAT}<span>Comment</span></button><button class="act" onclick="sharePost(${p.id})" aria-label="Share">${ICON_SHARE}<span>Share</span></button><button class="act ${saved.has(p.id) ? "sv" : ""}" onclick="toggleSave(${p.id})" aria-label="Save">${ICON_SAVE}<span>Save</span></button></div>`;
  if (openCm.has(p.id)){
    const list = cmts[p.id];
    h += list ? list.map(c => `<div class="cm">${avatar(c.profiles && c.profiles.name, false, c.profiles && c.profiles.avatar_url, c.user_id)}<div style="flex:1;min-width:0"><div class="bub"><div class="name lnk" onclick="openProfile('${c.user_id}')">${esc(c.profiles && c.profiles.name)}</div>${esc(c.body)}</div><div class="meta" style="margin:2px 0 0 12px">${ago(c.created_at)}${c.user_id === me.id ? ` · <button class="link" style="min-height:32px;font-size:13px" onclick="delCm(${p.id},${c.id})">Delete</button>` : ""}</div></div></div>`).join("") : `<div class="meta" style="margin-top:10px">Loading…</div>`;
    h += `<div class="cm-form"><input id="c-${p.id}" maxlength="500" placeholder="Write a comment…" aria-label="Write a comment" onkeydown="if(event.key==='Enter')addCm(${p.id})"><button class="btn" onclick="addCm(${p.id})">Send</button></div>`;
  }
  return h + `</div>`;
}
function toggleSave(id){
  saved.has(id) ? saved.delete(id) : saved.add(id);
  try { localStorage.setItem("circle_saved", JSON.stringify([...saved])); } catch (e) {}
  drawPost(id);
}
async function sharePost(id){
  const p = feed.find(x => x.id === id); if (!p) return;
  const data = { title: "Circle", text: (p.body || "A photo on Circle").slice(0, 200), url: location.origin + "/" };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(data.url); alert("Link copied"); }
  } catch (e) {}
}
async function toggleLike(id){
  const p = feed.find(x => x.id === id); if (!p) return;
  const liked = p.likes.some(l => l.user_id === me.id);
  const { error } = liked
    ? await sb.from("likes").delete().eq("post_id", id).eq("user_id", me.id)

function pickPhoto(input){
  const f = input.files && input.files[0];
  if (!f) return;
  pickedFile = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  $("prev").innerHTML = `<div class="prev"><img src="${previewUrl}" alt="Selected photo"><button onclick="clearPhoto()" aria-label="Remove photo">✕</button></div>`;
}
function clearPhoto(){ pickedFile = null; $("prev").innerHTML = ""; $("p-file").value = ""; }
async function shrink(file, max = 1280){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    return blob || file;
  } catch (e) { return file; }
}
async function addPost(){
  const body = $("p-body").value.trim();
  if (!body && !pickedFile) return;
  const btn = $("p-go"); btn.disabled = true;
  let image_url = null;
  if (pickedFile){
    const blob = await shrink(pickedFile);
    const path = `${me.id}/${Date.now()}.jpg`;
    const { error: ue } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if (ue){ btn.disabled = false; return alert("Photo upload failed: " + ue.message); }
    image_url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("posts").insert({ user_id: me.id, body, image_url });
  if (error){ btn.disabled = false; return alert(error.message); }
  renderHome();
}

async function cropTo(file, w, h){
  try {
    const bmp = await createImageBitmap(file);
    const ar = w / h; let sw = bmp.width, sh = sw / ar;
    if (sh > bmp.height){ sh = bmp.height; sw = sh * ar; }
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, w, h);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)) || file;
  } catch (e) { return file; }
}
function dropOld(url){ if (!url) return; const i = url.indexOf("/" + BUCKET + "/"); if (i > -1) sb.storage.from(BUCKET).remove([decodeURIComponent(url.slice(i + BUCKET.length + 2))]); }
async function setImage(input, kind){
  const f = input.files && input.files[0]; if (!f) return;
  const msg = $("av-msg"); msg.textContent = "Uploading…";
  const blob = kind === "avatar" ? await cropTo(f, 480, 480) : await cropTo(f, 1280, 540);
  const path = `${me.id}/${kind}-${Date.now()}.jpg`;
  const { error: ue } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
  if (ue){ msg.textContent = "Upload failed: " + ue.message; return; }
  const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  const col = kind === "avatar" ? "avatar_url" : "cover_url", old = me[col];
  const { data, error } = await sb.from("profiles").update({ [col]: url }).eq("id", me.id).select("*").single();
  if (error){
    sb.storage.from(BUCKET).remove([path]);
    msg.textContent = /column|schema cache/i.test(error.message) ? "Cover photos need migration-4.sql to be run in Supabase first." : error.message;
    return;
  }
  me = data; dropOld(old); rerender();
}

  if (!q){ $("s-res").innerHTML = `<div class="empty">Type a name to find people.</div>`; return; }
  const { data, error } = await sb.from("profiles").select("id,name,bio,avatar_url").ilike("name", "%" + q + "%").limit(20);
  if (!$("s-res") || tab !== "search") return;
  $("s-res").innerHTML = error ? `<div class="empty">${esc(error.message)}</div>`
    : !data.length ? `<div class="empty">No one found.</div>`
    : data.map(u => `<div class="card row lnk" style="margin-bottom:10px" onclick="openProfile('${u.id}')">${avatar(u.name, true, u.avatar_url)}<div><div class="name">${esc(u.name)}</div>${u.bio ? `<div class="meta">${esc(u.bio)}</div>` : ""}</div></div>`).join("");
}
function renderPost(id){
  $("main").innerHTML = `<button class="back" onclick="goBack()">‹ Back</button><div id="feed"><div class="empty">Loading…</div></div>`;
  loadFeed(null, [id]);
}
function renderSaved(){
  $("main").innerHTML = `<button class="back" onclick="goBack()">‹ Back</button><div id="feed"><div class="empty">Loading…</div></div>`;
  loadFeed(null, [...saved]);
}

/* ---------- start ---------- */
(async () => {
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovering = true; $("auth").classList.add("hidden"); $("app").classList.add("hidden"); $("reset").classList.remove("hidden"); } });
  const { data: { session } } = await sb.auth.getSession();
  if (recovering) { $("reset").classList.remove("hidden"); return; }
  if (session) boot(session.user); else $("auth").classList.remove("hidden");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
